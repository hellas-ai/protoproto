[package]
name = "web-node"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
hellas-node = { path = "../hellas-node" }
hellas-protocol = { path = "../hellas-protocol" }
iroh-base = { version = "0.90", default-features = false }
anyhow = "1.0.86"
futures = "0.3"
tracing = { version = "0.1.31" }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
js-sys = "0.3.69"
tracing-wasm = "0.2.1"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.42"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    'Document',
    'Element',
    'HtmlElement',
    'Node',
    'Response',
    'Window',
] }
