[package]
name = "hellas-node"
version = "0.1.0"
edition = "2021"

[[example]]
name = "integration_test"
path = "examples/integration_test.rs"

[dependencies]
hellas-morpheus = { path = "../hellas-morpheus" }
hellas-protocol = { path = "../hellas-protocol" }
iroh = { version = "0.90", default-features = false }
iroh-gossip = { version = "0.90", default-features = false, features = ["net"] }
iroh-base = { version = "0.90", default-features = false, features = ["ticket"] }

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
futures = "0.3"
blake3 = "1.5"
hex = "0.4"
bytes = "1.5"

# Database
redb = "2"

# Crypto (for test keybook)
ark-std = "0.4"
ark-serialize = "0.4"
rand = "0.8"

# For web targets
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"
