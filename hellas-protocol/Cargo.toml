[package]
name = "hellas-protocol"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Error handling
thiserror = "1.0"

# Crypto (for hashing, signatures stubbed)
sha2 = "0.10"

# Fixed-point arithmetic
fixed = { version = "1.28", features = ["serde"] }

# Parallelism
rayon = "1.7"

# Concurrency
parking_lot = "0.12"
dashmap = "5.5"

# Testing
rand = "0.8"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.21"
metrics-exporter-prometheus = "0.12"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
tokio = { version = "1.35", features = ["full", "test-util"] }
