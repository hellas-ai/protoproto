[package]
name = "native-node"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hellas-node"
path = "src/main.rs"
license = "Apache-2.0"

[dependencies]
hellas-node = { path = "../hellas-node" }
hellas-protocol = { path = "../hellas-protocol" }
tokio = { version = "1.43", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
iroh-base = { version = "0.90", default-features = false }
clap = { version = "4.0", features = ["derive"] }
hex = "0.4"